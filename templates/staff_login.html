<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login - Lost & Found</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    <style>
        .logo-container {
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: 3px solid var(--secondary);
            overflow: hidden;
        }

            .logo-container img {
                max-height: 70%;
                width: auto;
                border-radius: 5px;
            }

        .error-alert {
            color: #e74c3c;
            background: #fdeaea;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body data-lang="ar">

    <div class="auth-page-wrapper">
        <div class="top-buttons-auth">
            <a href="{{ url_for('login') }}" class="top-btn-auth" title="بوابة المسافرين"><i class="fa-solid fa-users"></i></a>
            <button class="top-btn-auth lang-toggle text-only" id="langToggleBtn">EN</button>
        </div>

        <div class="auth-box-container">

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="error-alert">
                <span class="auto-trans" data-ar="{{ message }}">{{ message }}</span>
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <div style="text-align: center; margin-bottom: 25px;">
                <div class="logo-container">
                    <img src="{{ url_for('static', filename='logo.jpg') }}"
                         onerror="this.onerror=null; this.src='https://i.postimg.cc/MTQwFp6T/Whats-App-Image-2026-03-06-at-1-02-33-AM.jpg';"
                         alt="Logo">
                </div>
            </div>

            <h2 data-i18n="auth_emp_title" style="color: var(--primary); margin-bottom: 25px; font-weight: 800;">بوابة الموظفين</h2>

            <form action="{{ url_for('staff_login') }}" method="POST">
                <div class="input-group">
                    <label data-i18n="auth_emp_id">الرقم الوظيفي</label>
                    <input type="text" id="empId" name="empId" data-i18n="auth_emp_id_ph" placeholder="مثال: 101" required autofocus>
                </div>

                <div class="input-group">
                    <label data-i18n="auth_pass">كلمة المرور</label>
                    <div class="password-wrapper">
                        <input type="password" id="empPass" name="empPass" data-i18n="auth_pass_ph" placeholder="••••••••" required>
                        <i class="fa-solid fa-eye toggle-password" onclick="togglePasswordVisibility()"></i>
                    </div>
                </div>

                <button type="submit" class="btn-primary-custom" data-i18n="auth_btn_emp_login" style="margin-top: 10px;">دخول لمهامي</button>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/global.js') }}"></script>

    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('empPass');
            const toggleIcon = document.querySelector('.toggle-password');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            const empIdInput = document.getElementById('empId');
            if (empIdInput) {
                empIdInput.addEventListener('input', function (e) {
                    this.value = this.value.replace(/[^0-9]/g, '');
                });
            }
        });
    </script>
</body>
</html>
