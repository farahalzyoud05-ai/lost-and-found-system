<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Lost & Found</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    <style>
        body {
            background-color: #f4f7f6;
            margin: 0;
        }
        .auth-page-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-box-container {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            text-align: center;
            position: relative;
            border-top: 5px solid var(--danger);
        }
        .top-buttons-auth {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }
        .auth-title {
            color: var(--primary);
            margin-bottom: 10px;
            font-weight: 800;
        }
        .auth-subtitle {
            color: gray;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .input-group {
            text-align: right;
            margin-bottom: 20px;
        }
        body[data-lang="en"] .input-group {
            text-align: left;
        }
        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        .password-wrapper {
            position: relative;
        }
        .password-wrapper input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 15px 12px 40px;
            border-radius: 10px;
            border: 1px solid #ddd;
            background-color: #fcfcfc;
            font-size: 15px;
            transition: 0.3s;
            font-family: inherit;
        }
        .password-wrapper input:focus {
            border-color: var(--danger);
            outline: none;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(231, 76, 60, 0.1);
        }
        .password-wrapper i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #7f8c8d;
            padding: 5px;
            z-index: 10;
        }
        .btn-primary-custom {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            margin-top: 10px;
            cursor: pointer;
            background-color: var(--danger);
            color: white;
            border: none;
            font-weight: bold;
            font-family: inherit;
            transition: 0.3s;
        }
        .btn-primary-custom:hover {
            background-color: #c0392b;
            transform: translateY(-2px);
        }
        .auth-links {
            display: flex;
            justify-content: center;
            margin-top: 15px;
        }
        .auth-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            transition: 0.3s;
        }
        .auth-links a:hover {
            color: var(--secondary);
        }
        body.dark-mode, body.dark-mode .auth-page-wrapper {
            background-color: #121620 !important;
        }
        body.dark-mode .auth-box-container {
            background: #1A2235 !important;
            color: white !important;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3) !important;
            border-top-color: var(--danger) !important;
        }
        body.dark-mode .auth-title,
        body.dark-mode .auth-subtitle,
        body.dark-mode .input-group label,
        body.dark-mode .auth-links a {
            color: #FFFFFF !important;
        }
        body.dark-mode .password-wrapper input {
            background: #121620 !important;
            color: white !important;
            border-color: #34495e !important;
        }
        @media (prefers-color-scheme: dark) {
            body:not(.light-mode), body:not(.light-mode) .auth-page-wrapper {
                background-color: #121620 !important;
            }
            body:not(.light-mode) .auth-box-container {
                background: #1A2235 !important;
                color: white !important;
                box-shadow: 0 10px 40px rgba(0,0,0,0.3) !important;
                border-top-color: var(--danger) !important;
            }
            body:not(.light-mode) .auth-title,
            body:not(.light-mode) .auth-subtitle,
            body:not(.light-mode) .input-group label,
            body:not(.light-mode) .auth-links a {
                color: #FFFFFF !important;
            }
            body:not(.light-mode) .password-wrapper input {
                background: #121620 !important;
                color: white !important;
                border-color: #34495e !important;
            }
        }
    </style>
</head>
<body data-lang="ar">
    <div class="auth-page-wrapper">
        <div class="top-buttons-auth">
            <a href="{{ url_for('login') }}" class="top-btn-auth" title="الرئيسية"><i class="fa-solid fa-house"></i></a>
            <button class="top-btn-auth lang-toggle text-only">EN</button>
        </div>
        <div class="auth-box-container">
            <i class="fa-solid fa-shield-halved" style="font-size: 50px; color: var(--danger); margin-bottom: 15px;"></i>
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, msg in messages %}
            <div class="auto-trans" data-ar="{{ msg }}" style="background: {% if category == 'success' %}#2ecc71{% else %}#e74c3c{% endif %}; color: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: center; font-weight: bold;">{{ msg }}</div>
            {% endfor %}
            {% endif %}
            {% endwith %}
            <h2 class="auto-trans auth-title" data-ar="استعادة كلمة المرور">استعادة كلمة المرور</h2>
            <p class="auto-trans auth-subtitle" data-ar="أدخل كلمة المرور الجديدة الخاصة بك أدناه.">أدخل كلمة المرور الجديدة الخاصة بك أدناه.</p>
            <form action="{{ url_for('reset_password') }}" method="POST">
                <div class="input-group">
                    <label class="auto-trans" data-ar="كلمة المرور الجديدة">كلمة المرور الجديدة</label>
                    <div class="password-wrapper">
                        <input type="password" name="new_password" class="ph-trans" data-ar="••••••••" placeholder="••••••••" maxlength="8" pattern="^(?=.*[a-zA-Z])(?=.*[^a-zA-Z0-9]).{1,8}$" title="يجب أن تحتوي كلمة المرور على حرف واحد ورمز واحد على الأقل، وأن لا تتجاوز 8 خانات" required>
                        <i class="fa-solid fa-eye toggle-password" onclick="toggleMyPass(this)"></i>
                    </div>
                </div>
                <div class="input-group">
                    <label class="auto-trans" data-ar="تأكيد كلمة المرور">تأكيد كلمة المرور</label>
                    <div class="password-wrapper">
                        <input type="password" name="confirm_password" class="ph-trans" data-ar="••••••••" placeholder="••••••••" maxlength="8" required>
                        <i class="fa-solid fa-eye toggle-password" onclick="toggleMyPass(this)"></i>
                    </div>
                </div>
                <button type="submit" class="btn-primary-custom auto-trans" data-ar="تحديث كلمة المرور">تحديث كلمة المرور</button>
            </form>
            <div class="auth-links">
                <a href="{{ url_for('login') }}" class="auto-trans" data-ar="تذكرت كلمة المرور؟ تسجيل الدخول">تذكرت كلمة المرور؟ تسجيل الدخول</a>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/global.js') }}"></script>
    <script>
        function toggleMyPass(icon) {
            let input = icon.previousElementSibling;
            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
                icon.style.color = "var(--danger)";
            } else {
                input.type = "password";
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
                icon.style.color = "#7f8c8d";
            }
        }
        const dict = {
            'استعادة كلمة المرور': 'Reset Password',
            'أدخل كلمة المرور الجديدة الخاصة بك أدناه.': 'Enter your new password below.',
            'كلمة المرور الجديدة': 'New Password',
            'تأكيد كلمة المرور': 'Confirm Password',
            'تحديث كلمة المرور': 'Update Password',
            'تذكرت كلمة المرور؟ تسجيل الدخول': 'Remembered your password? Login',
            'كلمات المرور غير متطابقة!': 'Passwords do not match!'
        };
        function translateAll() {
            let lang = localStorage.getItem('appLang') || document.body.getAttribute('data-lang') || 'ar';
            document.querySelectorAll('.auto-trans').forEach(el => {
                let arText = el.getAttribute('data-ar');
                if (arText) {
                    arText = arText.trim();
                    let enText = dict[arText] || arText;
                    if (lang === 'en') {
                        if (el.innerHTML.includes(arText)) {
                            el.innerHTML = el.innerHTML.replace(arText, enText);
                        } else if (el.textContent.trim() === arText) {
                            el.textContent = enText;
                        }
                    } else {
                        if (el.innerHTML.includes(enText)) {
                            el.innerHTML = el.innerHTML.replace(enText, arText);
                        } else if (el.textContent.trim() === enText) {
                            el.textContent = arText;
                        }
                    }
                }
            });
            document.querySelectorAll('.ph-trans').forEach(el => {
                let arText = el.getAttribute('data-ar');
                if (lang === 'en' && dict[arText]) el.placeholder = dict[arText];
                else el.placeholder = arText;
            });
            document.body.style.direction = lang === 'en' ? 'ltr' : 'rtl';
        }
        document.addEventListener('DOMContentLoaded', () => {
            translateAll();
            const observer = new MutationObserver(translateAll);
            observer.observe(document.body, { attributes: true, attributeFilter: ['data-lang'] });
        });
    </script>
</body>
</html>
