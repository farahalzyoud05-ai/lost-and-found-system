<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Lost & Found</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    <style>
        body {
            background-color: #f4f7f6;
            margin: 0;
        }
        .auth-page-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-box-container {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            text-align: center;
            position: relative;
        }
        .logo-container {
            width: 90px;
            height: 90px;
            background: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            border: 3px solid var(--secondary);
            overflow: hidden;
        }
        .logo-container img {
            max-height: 70%;
            width: auto;
        }
        .auth-title {
            color: var(--primary);
            margin-bottom: 15px;
            font-weight: 800;
        }
        .auth-desc {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .input-group {
            text-align: right;
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--dark);
        }
        .input-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #ddd;
            background-color: #fcfcfc;
            font-size: 15px;
            transition: 0.3s;
            font-family: inherit;
        }
        .input-group input:focus {
            border-color: var(--secondary, #d4af37);
            outline: none;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }
        .btn-primary-custom {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            margin-top: 10px;
            cursor: pointer;
            background-color: var(--primary);
            color: white;
            border: none;
            font-weight: bold;
            font-family: inherit;
            transition: 0.3s;
        }
        .btn-primary-custom:hover {
            background-color: #0f1a36;
            transform: translateY(-2px);
        }
        body[data-lang="en"] .input-group {
            text-align: left;
        }
        body.dark-mode, body.dark-mode .auth-page-wrapper {
            background-color: #121620 !important;
        }
        body.dark-mode .auth-box-container {
            background: #1A2235 !important;
            color: #FFFFFF !important;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3) !important;
        }
        body.dark-mode .auth-title,
        body.dark-mode .auth-desc,
        body.dark-mode .input-group label {
            color: #FFFFFF !important;
        }
        body.dark-mode .input-group input {
            background: #121620 !important;
            color: #FFFFFF !important;
            border-color: #34495e !important;
        }
        @media (prefers-color-scheme: dark) {
            body:not(.light-mode), body:not(.light-mode) .auth-page-wrapper {
                background-color: #121620 !important;
            }
            body:not(.light-mode) .auth-box-container {
                background: #1A2235 !important;
                color: #FFFFFF !important;
                box-shadow: 0 10px 40px rgba(0,0,0,0.3) !important;
            }
            body:not(.light-mode) .auth-title,
            body:not(.light-mode) .auth-desc,
            body:not(.light-mode) .input-group label {
                color: #FFFFFF !important;
            }
            body:not(.light-mode) .input-group input {
                background: #121620 !important;
                color: #FFFFFF !important;
                border-color: #34495e !important;
            }
        }
    </style>
</head>
<body data-lang="ar">
    <div class="auth-page-wrapper">
        <div class="top-buttons-auth" style="position: absolute; top: 20px; right: 20px; display: flex; gap: 10px;">
            <a href="{{ url_for('login') }}" class="top-btn-auth" title="الرئيسية"><i class="fa-solid fa-arrow-right" id="backIcon"></i></a>
            <button class="top-btn-auth lang-toggle text-only">EN</button>
        </div>
        <div class="auth-box-container">
            <div class="logo-container">
                <img src="{{ url_for('static', filename='logo.jpg') }}" onerror="this.onerror=null; this.src='https://i.postimg.cc/MTQwFp6T/Whats-App-Image-2026-03-06-at-1-02-33-AM.jpg';" alt="Logo">
            </div>
            {% with messages = get_flashed_messages() %}
            {% if messages %}
            {% for msg in messages %}
            <div class="auto-trans" data-ar="{{ msg }}" style="background: #e74c3c; color: white; padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: center; font-weight: bold;">{{ msg }}</div>
            {% endfor %}
            {% endif %}
            {% endwith %}
            <h2 class="auto-trans auth-title" data-ar="استعادة كلمة المرور">استعادة كلمة المرور</h2>
            <p class="auto-trans auth-desc" data-ar="أدخل بريدك الإلكتروني وسنقوم بإرسال رمز التحقق (OTP) إليك.">أدخل بريدك الإلكتروني وسنقوم بإرسال رمز التحقق (OTP) إليك.</p>
            <form action="{{ url_for('forgot_password') }}" method="POST">
                <div class="input-group">
                    <label class="auto-trans" data-ar="البريد الإلكتروني">البريد الإلكتروني</label>
                    <input type="email" name="email" class="ph-trans" data-ar="example@airport.com" placeholder="example@airport.com" required>
                </div>
                <button type="submit" class="btn-primary-custom auto-trans" data-ar="إرسال رمز التحقق">إرسال رمز التحقق</button>
            </form>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/global.js') }}"></script>
    <script>
        const dict = {
            'استعادة كلمة المرور': 'Forgot Password',
            'أدخل بريدك الإلكتروني وسنقوم بإرسال رمز التحقق (OTP) إليك.': 'Enter your email and we will send an OTP code to you.',
            'البريد الإلكتروني': 'Email Address',
            'إرسال رمز التحقق': 'Send OTP',
            'البريد الإلكتروني غير مسجل!': 'Email is not registered!',
            'البريد الإلكتروني غير مسجل لدينا!': 'Email is not registered with us!',
            'تم إرسال رمز التحقق إلى بريدك الإلكتروني.': 'OTP has been sent to your email.',
            'الرجاء إدخال البريد الإلكتروني.': 'Please enter your email.',
            'حدث خطأ ما!': 'An error occurred!'
        };
        function translateAll() {
            let lang = localStorage.getItem('appLang') || document.body.getAttribute('data-lang') || 'ar';
            document.querySelectorAll('.auto-trans').forEach(el => {
                let arText = el.getAttribute('data-ar');
                if (arText) {
                    arText = arText.trim();
                    let enText = dict[arText] || arText;
                    if (lang === 'en') {
                        if (el.innerHTML.includes(arText)) {
                            el.innerHTML = el.innerHTML.replace(arText, enText);
                        } else if (el.textContent.trim() === arText) {
                            el.textContent = enText;
                        }
                    } else {
                        if (el.innerHTML.includes(enText)) {
                            el.innerHTML = el.innerHTML.replace(enText, arText);
                        } else if (el.textContent.trim() === enText) {
                            el.textContent = arText;
                        }
                    }
                }
            });
            document.querySelectorAll('.ph-trans').forEach(el => {
                let arText = el.getAttribute('data-ar');
                if (lang === 'en' && dict[arText]) el.placeholder = dict[arText];
                else el.placeholder = arText;
            });
            document.body.style.direction = lang === 'en' ? 'ltr' : 'rtl';
            const icon = document.getElementById('backIcon');
            if (icon) {
                icon.className = (lang === 'en') ? 'fa-solid fa-arrow-left' : 'fa-solid fa-arrow-right';
            }
        }
        document.addEventListener('DOMContentLoaded', () => {
            translateAll();
            const observer = new MutationObserver(translateAll);
            observer.observe(document.body, { attributes: true, attributeFilter: ['data-lang'] });
        });
    </script>
</body>
</html>
